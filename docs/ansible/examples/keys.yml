# Example: roles/keys/tasks/main.yml
#
# Owns SSH and GPG identity for the VM. Two modes:
#
#   dvm_keys_mode: generate  — make fresh ed25519 keys inside the VM if missing
#   dvm_keys_mode: vault     — restore encrypted private keys from Ansible Vault
#
# Generate is safer (private keys never leave the VM). Vault is convenient
# when you want the same identity across recreated VMs. Pick one per VM via
# DVM_ANSIBLE_EXTRA_VARS=("dvm_keys_mode=generate").

- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "/home/{{ dvm_user }}/.ssh"
    state: directory
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0700"
  become: true

# --- generate -------------------------------------------------------------

- name: Generate SSH access key
  community.crypto.openssh_keypair:
    path: "/home/{{ dvm_user }}/.ssh/id_ed25519_dvm"
    type: ed25519
    comment: "dvm-{{ dvm_name }}"
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0600"
  become: true
  when: dvm_keys_mode | default('generate') == 'generate'

- name: Generate SSH signing key
  community.crypto.openssh_keypair:
    path: "/home/{{ dvm_user }}/.ssh/id_ed25519_dvm_signing"
    type: ed25519
    comment: "dvm-{{ dvm_name }}-signing"
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0600"
  become: true
  when: dvm_keys_mode | default('generate') == 'generate'

- name: Configure git to sign commits with SSH key
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - git config --global gpg.format ssh
    - git config --global user.signingkey /home/{{ dvm_user }}/.ssh/id_ed25519_dvm_signing.pub
    - git config --global commit.gpgsign true
  become: true
  become_user: "{{ dvm_user }}"
  when: dvm_keys_mode | default('generate') == 'generate'
  changed_when: false

- name: Show public keys to register with git host
  ansible.builtin.shell: |
    set -e
    echo "--- access key ---"
    cat /home/{{ dvm_user }}/.ssh/id_ed25519_dvm.pub
    echo "--- signing key ---"
    cat /home/{{ dvm_user }}/.ssh/id_ed25519_dvm_signing.pub
  become: true
  become_user: "{{ dvm_user }}"
  changed_when: false
  when: dvm_keys_mode | default('generate') == 'generate'

# --- vault ----------------------------------------------------------------

- name: Restore SSH access key from vault
  ansible.builtin.copy:
    dest: "/home/{{ dvm_user }}/.ssh/id_ed25519_dvm"
    content: "{{ dvm_ssh_access_key }}"
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0600"
  become: true
  no_log: true
  when:
    - dvm_keys_mode | default('generate') == 'vault'
    - dvm_ssh_access_key is defined

- name: Restore SSH signing key from vault
  ansible.builtin.copy:
    dest: "/home/{{ dvm_user }}/.ssh/id_ed25519_dvm_signing"
    content: "{{ dvm_ssh_signing_key }}"
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0600"
  become: true
  no_log: true
  when:
    - dvm_keys_mode | default('generate') == 'vault'
    - dvm_ssh_signing_key is defined
