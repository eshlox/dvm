# Example: roles/sandbox/tasks/main.yml
#
# Installs bubblewrap and a /usr/local/bin/dvm-agent wrapper that runs an
# arbitrary command as the sandbox user inside bwrap. Run this AFTER the
# `agent_user` role.
#
# What the sandbox guarantees:
#   - /workspace is the only writable path on the project side. It binds
#     to dvm_code_dir (owned by dvm_user:dvm_user, mode 02775; the agent
#     user is in dvm_user's group).
#   - The agent's own $HOME is private and writable (its own files only).
#   - Everything else is read-only.
#   - /tmp, /var/tmp, /run are tmpfs — nothing leaks between invocations.
#   - PID, IPC, and UTS namespaces are unshared.
#   - Network is shared by default so AI tools can reach their APIs.
#     Add `--unshare-net` to the wrapper for offline runs.
#
# Inside the VM:
#   dvm-agent claude       # runs claude inside the sandbox
#   dvm-agent codex        # runs codex inside the sandbox
#   dvm-agent bash         # interactive sandbox shell, useful for debugging

- name: Install bubblewrap
  ansible.builtin.package:
    name: bubblewrap
    state: present
  become: true

- name: Install dvm-agent sandbox wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/dvm-agent
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Run a command as the sandbox user inside bubblewrap.
      # Generated by the dvm sandbox role — edit the role, not this file.
      set -euo pipefail

      CODE_DIR="{{ dvm_code_dir }}"
      AGENT_USER="{{ dvm_agent_user | default('dvm-agent') }}"
      AGENT_HOME="/home/$AGENT_USER"

      exec sudo -u "$AGENT_USER" -H bwrap \
          --ro-bind / / \
          --proc /proc --dev /dev \
          --tmpfs /tmp --tmpfs /var/tmp --tmpfs /run \
          --bind "$AGENT_HOME" "$AGENT_HOME" \
          --bind "$CODE_DIR" /workspace \
          --chdir /workspace \
          --setenv HOME "$AGENT_HOME" \
          --setenv USER "$AGENT_USER" \
          --setenv DVM_WORKSPACE /workspace \
          --unshare-pid --unshare-ipc --unshare-uts \
          --die-with-parent \
          -- "$@"
  become: true
