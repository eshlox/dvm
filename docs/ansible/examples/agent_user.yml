# Example: roles/agent_user/tasks/main.yml
#
# Creates the unprivileged sandbox user that AI tooling (codex/claude/opencode)
# runs as. Keeps agent processes off the primary developer account so a
# compromised model session cannot rewrite your shell config or push code as
# you.

- name: Create agent user
  ansible.builtin.user:
    name: "{{ dvm_agent_user | default('dvm-agent') }}"
    shell: /bin/bash
    create_home: true
    state: present
  become: true

- name: Allow developer to sudo to agent user without password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/dvm-agent"
    mode: "0440"
    content: |
      {{ dvm_user }} ALL=({{ dvm_agent_user | default('dvm-agent') }}) NOPASSWD:ALL
  become: true

- name: Install agent wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/dvm-agent
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Run a command as the sandbox agent user, in the project dir.
      exec sudo -u {{ dvm_agent_user | default('dvm-agent') }} -H \
        bash -lc "cd {{ dvm_code_dir }} && \"\$@\"" -- "$@"
  become: true
