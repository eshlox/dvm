# Example: roles/base/tasks/main.yml
#
# Minimum guest baseline. Tag everything `base` so `--tags base` reproduces
# only this slice. Keep it small and non-secret so it is safe to bake into
# the optional shared base VM.

- name: Install common packages
  ansible.builtin.package:
    name:
      - git
      - tmux
      - zsh
      - ripgrep
      - fd-find
      - helix
      - bat
      - fzf
      - just
      - python3
      - python3-pip
    state: present
  become: true

- name: Ensure code root exists
  ansible.builtin.file:
    path: "/home/{{ dvm_user }}/code"
    state: directory
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    mode: "0755"
  become: true

- name: Ensure per-VM code dir exists
  ansible.builtin.file:
    path: "{{ dvm_code_dir }}"
    state: directory
    owner: "{{ dvm_user }}"
    group: "{{ dvm_user }}"
    # mode 02775: group-writable + setgid so files created inside inherit
    # the group. The agent_user role adds the AI sandbox account to this
    # group so AI tools running inside bwrap can edit project code.
    mode: "02775"
  become: true
