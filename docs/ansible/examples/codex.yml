# Example: roles/codex/tasks/main.yml
#
# Installs the Codex CLI into the agent user's home. Runs after agent_user
# so the sandbox account exists. The Codex token is read from the host
# environment at sync time and never travels through DVM config.

- name: Install Node (Codex prerequisite)
  ansible.builtin.package:
    name: nodejs
    state: present
  become: true

- name: Install codex CLI for the agent user
  ansible.builtin.command:
    cmd: npm install -g @openai/codex
    creates: /usr/local/bin/codex
  become: true

- name: Write Codex auth file
  ansible.builtin.copy:
    dest: "/home/{{ dvm_agent_user | default('dvm-agent') }}/.codex/auth.json"
    content: "{{ codex_auth_json }}"
    owner: "{{ dvm_agent_user | default('dvm-agent') }}"
    group: "{{ dvm_agent_user | default('dvm-agent') }}"
    mode: "0600"
  become: true
  no_log: true
  when: codex_auth_json is defined

# codex_auth_json should come from Ansible Vault or:
#   codex_auth_json: "{{ lookup('env', 'DVM_CODEX_AUTH_JSON') }}"
# in group_vars/all.yml.
